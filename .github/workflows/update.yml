name: Update Scholar Papers

# Google Scholar frequently blocks requests coming from GitHub-hosted runners.
# When that happens update.py exits non-zero *without* touching index.html, so
# the run fails loudly and the published site is never damaged. Refresh from a
# normal network instead:
#
#     python update.py
#
on:
  schedule:
    - cron: '0 6 * * 1'    # Mondays at 06:00 UTC
  workflow_dispatch:

# Required for the bot to push the refreshed index.html back to the branch.
permissions:
  contents: write

concurrency:
  group: scholar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh publications from Google Scholar
        run: python update.py          # stdlib only, nothing to install

      - name: Commit and push if the page changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No change in index.html — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: refresh publications from Google Scholar"
          git push
